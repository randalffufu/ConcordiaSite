name:  Build Docker Image

on:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write  # ← GHCR push !

    steps:
    - uses: actions/checkout@v4

    # Sans cette étape, buildx utilise le driver "docker" par défaut,
    # dont le push vers GHCR échoue par intermittence ("unknown blob").
    - name: Set up Buildx
      uses: docker/setup-buildx-action@v3

    - name: Login GitHub Container Registry
      uses: docker/login-action@v3
      with:
        registry: ghcr.io
        username: ${{ github.repository_owner }}
        password: ${{ secrets.GITHUB_TOKEN }}
    
    - name:  Build & Push Image
      uses: docker/build-push-action@v6
      with:
        context: .
        file: dockerfile
        push: true
        # Garde une image simple mono-plateforme, comme aujourd'hui :
        # sans ça, le driver docker-container publie un index OCI + attestation.
        provenance: false
        tags: |
          ghcr.io/${{ github.repository_owner }}/concordiasite:latest
          ghcr.io/${{ github.repository_owner }}/concordiasite:${{ github.sha }}
